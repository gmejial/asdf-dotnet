name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  plugin_test:
    name: asdf plugin test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: asdf plugin test
        uses: asdf-vm/actions/plugin-test@v4
        with:
          command: dotnet --version
          plugin: dotnet-sdk
          version: 8.0.426

  real_sdk:
    name: Real SDK smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: asdf-vm/actions/setup@v4
        with:
          asdf_version: latest
      - name: Install the plugin and SDK
        run: |
          asdf plugin add dotnet-sdk "$GITHUB_WORKSPACE"
          asdf install dotnet-sdk 8.0.426
          asdf set -u dotnet-sdk 8.0.426
          asdf exec dotnet --version
          asdf reshim dotnet-sdk
      - name: Build and run a console project
        run: |
          project="$RUNNER_TEMP/console-project"
          rm -rf "$project"
          mkdir -p "$project"
          cd "$project"
          dotnet new console -o app --no-restore
          dotnet build app
          dotnet run --project app --no-build
      - name: Build and run a global tool through its shim
        run: |
          dotnet tool install --global csharp-ls --version 0.16.0
          asdf cmd dotnet-sdk shims
          shim_dir="${XDG_DATA_HOME:-$HOME/.local/share}/asdf-dotnet-sdk/bin"
          export PATH="$shim_dir:$PATH"
          [ "$(command -v csharp-ls)" = "$shim_dir/csharp-ls" ]
          csharp-ls --version
      - name: Resolve global.json and .tool-versions precedence
        run: |
          rm -f "$HOME/.tool-versions"
          printf 'legacy_version_file = yes\n' >"$HOME/.asdfrc"
          project="$RUNNER_TEMP/legacy-project"
          rm -rf "$project"
          mkdir -p "$project/sub"
          printf '{"sdk":{"version":"8.0.426"}}\n' >"$project/global.json"
          cd "$project/sub"
          asdf current dotnet-sdk | grep -F '8.0.426'
          printf 'dotnet-sdk 8.0.426\n' >"$project/.tool-versions"
          printf '{"sdk":{"version":"9.0.312"}}\n' >"$project/global.json"
          asdf current dotnet-sdk | grep -F '8.0.426'
