name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  plugin_test:
    name: asdf plugin test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: asdf plugin test
        uses: asdf-vm/actions/plugin-test@v4
        with:
          command: dotnet --version
          version: 8.0.426

      - name: Test environment helpers
        run: |
          project="$(mktemp -d)"
          printf 'dotnet 8.0.426\n' >"$project/.tool-versions"
          cd "$project"
          asdf dotnet exec dotnet --version
          asdf dotnet exec printenv DOTNET_ROOT
          asdf dotnet exec printenv MSBuildSDKsPath
          eval "$(asdf dotnet env)"
          test "$DOTNET_ROOT" = "$(asdf where dotnet)"
          test -n "$MSBuildSDKsPath"
